<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>2nd STREET 包包新上架圖鑑</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f4f5f7;
      color: #333;
    }
    .container { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .meta { font-size: 13px; color: #666; margin-bottom: 12px; }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filter-btn {
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid #d0d7de;
      background: #fff;
      color: #333;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .filter-btn.active {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .search-bar {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 18px;
      outline: none;
      background: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 14px;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }
    .img-box {
      width: 100%;
      padding-top: 100%;
      position: relative;
      background: #eceef2;
    }
    .img-box img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .badges {
      position: absolute;
      top: 8px;
      left: 8px;
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      z-index: 2;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      color: #fff;
    }
    .badge-new { background: #1f2328; }
    .badge-drop { background: #cf222e; }
    .info {
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }
    .title {
      font-size: 13px;
      line-height: 1.35;
      max-height: 2.7em;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-all;
    }
    .btn-link {
      margin-top: 6px;
      font-size: 12px;
      color: #0969da;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎒 2nd STREET 包包 / 新上架圖鑑</h1>
    <div class="meta" id="meta">資料載入中...</div>

    <div class="controls">
      <button class="filter-btn active" data-mode="all">全部商品</button>
      <button class="filter-btn" data-mode="new">🆕 新上架</button>
      <button class="filter-btn" data-mode="drop">📉 已降價</button>
    </div>

    <input id="searchInput" class="search-bar" type="text" placeholder="🔍 搜尋品牌或關鍵字（如 Supreme, Coach...）" />
    <div class="grid" id="grid"></div>
  </div>

  <script>
    let allItems = [];
    let currentMode = "all";

    function isNewItem(item) {
      const t = (item.title || "").toLowerCase();
      return Boolean(item.is_new) || t.includes("新上架") || t.includes("new");
    }

    function isDropItem(item) {
      const t = (item.title || "").toLowerCase();
      return Boolean(item.is_price_drop) || t.includes("已降價") || t.includes("降價");
    }

    function render() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      const filtered = allItems.filter(item => {
        const text = (item.title || "").toLowerCase();
        const matchKeyword = !keyword || text.includes(keyword);
        if (!matchKeyword) return false;
        if (currentMode === "new") return isNewItem(item);
        if (currentMode === "drop") return isDropItem(item);
        return true;
      });

      const gridEl = document.getElementById("grid");
      gridEl.innerHTML = filtered.map(item => {
        const badges = [];
        if (isNewItem(item)) badges.push(`<span class="badge badge-new">新上架</span>`);
        if (isDropItem(item)) badges.push(`<span class="badge badge-drop">已降價↓</span>`);

        const imgHtml = item.image
          ? `<img src="${escapeAttr(item.image)}" alt="商品圖片" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'" />`
          : "";

        return `
          <a class="card" href="${escapeAttr(item.url)}" target="_blank" rel="noopener">
            <div class="img-box">
              <div class="badges">${badges.join("")}</div>
              ${imgHtml}
            </div>
            <div class="info">
              <div class="title">${escapeHtml(item.title)}</div>
              <div class="btn-link">查看商品 ➔</div>
            </div>
          </a>
        `;
      }).join("") || `<div style="grid-column: 1/-1; padding: 20px; text-align: center; color: #999;">找不到符合的商品</div>`;

      const newCount = allItems.filter(isNewItem).length;
      const dropCount = allItems.filter(isDropItem).length;
      document.getElementById("meta").textContent =
        `顯示 ${filtered.length} 筆｜新上架 ${newCount} 筆・已降價 ${dropCount} 筆（總筆數 ${allItems.length} 筆）`;
    }

    function escapeHtml(str) { return (str || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])); }
    function escapeAttr(str) { return (str || "").replace(/"/g, "&quot;"); }

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentMode = btn.dataset.mode;
        render();
      });
    });

    fetch("./results.json?t=" + Date.now())
      .then(res => res.json())
      .then(data => {
        allItems = data.items || [];
        render();
      })
      .catch(() => {
        document.getElementById("meta").textContent = "讀取商品資料失敗，請確認 Actions 是否執行成功。";
      });

    document.getElementById("searchInput").addEventListener("input", render);
  </script>
</body>
</html>
