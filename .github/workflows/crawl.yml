name: Crawl 2nd STREET Supreme

on:
  workflow_dispatch: {}        # 允許在網頁手動點擊執行
  schedule:
    - cron: "0 1 * * *"        # 每天 UTC 01:00（台灣時間 09:00）自動跑一次

permissions:
  contents: write            # 允許將抓到的資料寫回 GitHub

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝 Playwright 與瀏覽器
        run: |
          pip install playwright
          playwright install chromium

      - name: 執行爬蟲程式
        run: python scraper.py

      - name: 將抓到的結果存回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --staged --quiet || git commit -m "Update Supreme items"
          git push
